<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Email Copilot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <div class="app">

      <!-- Header -->
      <header class="header">
        <div class="header-brand">
          <div class="brand-dot"></div>
          <span class="brand-name">Email Copilot</span>
        </div>
        <span id="status" class="badge">idle</span>
      </header>

      <!-- Tool links -->
      <div class="tool-links">
        <a href="http://sz.anvsoft-dev.com:81/login?back_url=http%3A%2F%2Fsz.anvsoft-dev.com%3A81%2Fprojects" target="_blank" class="tool-link">Redmine</a>
        <a href="https://onedrive.live.com/view.aspx?cid=0&resid=9B933E8E402555BD!2536&origin=DigestEmail&extension=extension&e=vTZG6pjLO0uqFhVelm49Tw&at=20" target="_blank" class="tool-link">退款表格</a>
        <a href="https://ipn.anvsoftware.com/query/index.php" target="_blank" class="tool-link">技术支持</a>
        <a href="https://docs.qq.com/sheet/DWmVpcVpqWGRiTUVK?tab=BB08J2" target="_blank" class="tool-link">Credit 表格</a>
      </div>

      <!-- Main actions -->
      <div class="action-bar">
        <button id="captureBtn" class="btn-primary">Capture</button>
        <button id="clearBtn" class="btn-ghost btn-clear">Clear</button>
      </div>

      <!-- Thread -->
      <div class="card">
        <div class="field-group">
          <div class="field-label-row">
            <label for="subject">Subject</label>
            <button id="copyTicketBtn" class="copy-chip">复制工单号</button>
          </div>
          <input id="subject" type="text" />
        </div>
        <details class="subtle-details">
          <summary>Email Thread</summary>
          <textarea id="threadText" rows="9" style="margin-top:8px"></textarea>
        </details>
      </div>

      <!-- Order lookup -->
      <div class="card">
        <div class="field-group">
          <div class="field-label-row">
            <label for="customerEmailInput">Customer Email</label>
            <button id="copyEmailBtn" class="copy-chip">复制邮箱</button>
          </div>
          <div class="search-row">
            <input id="customerEmailInput" type="email" placeholder="自动识别，或手动填写后重新查询" />
            <button id="orderSearchBtn" class="btn-secondary">Search</button>
            <button id="orderSearchDebugBtn" class="btn-ghost-sm">Debug</button>
          </div>
        </div>
        <div class="field-group">
          <div class="lookup-label-row">
            <label for="manualLookup">Order Lookup Result</label>
            <button class="lookup-toggle" id="lookupToggleBtn" style="display:none">原始数据</button>
          </div>
          <div id="orderResultsDisplay" style="display:none"></div>
          <textarea id="manualLookup" rows="5" placeholder="订单查询结果将显示在这里，或手动粘贴..."></textarea>
        </div>
      </div>

      <!-- Chatbox -->
      <div class="card">
        <div class="field-group">
          <label for="productSelect">主要产品</label>
          <div class="search-row"><select id="productSelect"><option value="">自动识别 / 请选择</option></select><button id="resolveProductBtn" class="btn-secondary">重新识别</button></div>
          <small id="productReason">根据工单队列、邮件和订单识别，可手动纠正。</small>
        </div>
      </div>
      <div class="chat-wrap">
        <!-- messages area -->
        <div class="chat-body">
          <div class="chat-header">
            <span class="chat-label">Chat</span>
            <button id="chatClearBtn" class="chat-clear-btn">清空对话</button>
          </div>
          <div id="chatMessages" class="chat-messages"></div>
        </div>
        <!-- footer: chips + input -->
        <div class="chat-footer">
          <div class="chat-quick-actions" id="chatQuickActions">
            <button class="chat-chip" data-task="draft" data-msg="帮我写一封英文回复邮件。">写回复</button>
            <button class="chat-chip" data-task="summary" data-msg="用2-3句话总结一下客户的问题。">总结问题</button>
            <button class="chat-chip" data-task="questions" data-msg="我还需要向客户询问哪些信息？">还需问什么</button>
            <button class="chat-chip" data-task="next_step" data-msg="这个工单下一步应该怎么处理？">下一步</button>
          </div>
          <div class="chat-input-row">
            <textarea id="chatInput" rows="2" placeholder="随时提问…"></textarea>
            <button id="chatSendBtn" class="btn-primary chat-send-btn">发送</button>
          </div>
        </div>
      </div>

      <!-- Config (collapsed) -->
      <details class="card">
        <summary class="card-summary">⚙ Config</summary>
        <div class="field-group">
          <label for="backendUrl">Backend URL</label>
          <input id="backendUrl" type="text" value="http://localhost:8787" />
        </div>
        <div class="field-group">
          <label for="copilotToken">助手访问密钥</label>
          <input id="copilotToken" type="password" autocomplete="off" placeholder="公司服务器配置的 COPILOT_ACCESS_TOKEN" />
          <button id="saveConnectionBtn" class="btn-secondary">保存连接设置</button>
        </div>
        <details class="subtle-details">
          <summary>Centuran Selectors</summary>
          <div class="field-group" style="margin-top:8px">
            <label for="subjectSelectors">Subject Selectors</label>
            <textarea id="subjectSelectors" rows="4"></textarea>
          </div>
          <div class="field-group">
            <label for="threadSelectors">Thread Container Selectors</label>
            <textarea id="threadSelectors" rows="5"></textarea>
          </div>
          <div class="field-group">
            <label for="messageSelectors">Message Item Selectors</label>
            <textarea id="messageSelectors" rows="4"></textarea>
          </div>
        </details>
      </details>

      <!-- Debug (collapsed) -->
      <details class="card">
        <summary class="card-summary">Debug Info</summary>
        <pre id="debugInfo"></pre>
      </details>

    </div>
    <script src="panel.js"></script>
  </body>
</html>
